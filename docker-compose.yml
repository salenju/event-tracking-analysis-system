services:
  mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: event_tracking
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-proot']
      interval: 5s
      timeout: 5s
      retries: 20

  track-server:
    build:
      context: .
      dockerfile: packages/track-server/Dockerfile
    environment:
      NODE_ENV: production
      START_MODE: all
      PORT: '8080'
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: event_tracking
      APP_SECRETS: '{"fylinking-storefront":"local-dev-secret"}'
      SIGN_REQUIRED: 'false'
      CORS_ORIGINS: '*'
      TRACK_ENV: prod
      LOG_LEVEL: info
    ports:
      - '8080:8080'
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
