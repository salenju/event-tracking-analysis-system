services:
  mysql:
    image: mysql:8.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: event_tracking
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-proot']
      interval: 5s
      timeout: 5s
      retries: 20

  track-server:
    build:
      context: .
      dockerfile: packages/track-server/Dockerfile
    environment:
      NODE_ENV: production
      START_MODE: all
      PORT: '8080'
      DB_HOST: mysql
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: event_tracking
      # 存量应用的静态密钥；新建应用请用管理后台（写 analytics_apps 表），不再改这里
      APP_SECRETS: '{"fylinking-storefront":"local-dev-secret"}'
      # 脚本标签接入（后台一键复制的接入代码）不带签名密钥，需保持 false
      SIGN_REQUIRED: 'false'
      CORS_ORIGINS: '*'
      TRACK_ENV: prod
      # 后台生成的接入地址用这个域名（含协议）；留空则用看板当前站点 origin
      PUBLIC_TRACK_BASE_URL: ''
      # SDK 静态文件地址；留空则按 <base>/sdk/flyway-track-sdk.min.js 拼接
      SDK_PUBLIC_URL: ''
      LOG_LEVEL: info
      # 看板登录：飞书开放平台「网页应用」凭证
      FEISHU_APP_ID: ''
      FEISHU_APP_SECRET: ''
      FEISHU_REDIRECT_URI: 'http://localhost:5174/api/auth/feishu/callback'
      WEB_ORIGIN: 'http://localhost:5174'
      SESSION_TTL_HOURS: '168'
      # 本 compose 用于本地联调，先关掉鉴权；生产环境请填好上面的飞书凭证后改成 true
      AUTH_REQUIRED: 'false'
      DEV_LOGIN_ENABLED: 'true'
    ports:
      - '8080:8080'
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
